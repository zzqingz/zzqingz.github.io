name: Update Google Scholar citations
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: scholar-citations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Fetch public citation count
        run: python google_scholar_crawler/update_citations.py
      - name: Save citation count
        run: |
          if git diff --quiet -- _data/scholar.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/scholar.json
          git commit -m 'Update Google Scholar citation count'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
